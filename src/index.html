<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div class="card">
      <a
        href="#"
        class="card__link"
      >
        <img
          src="./images/imac.jpeg"
          alt="IMAC logo"
          class="card__logo"
        />
      </a>
      <div class="card__details">
        <h3 class="card__title">
          <a
            href="#"
            class="card__title-link"
          >
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </a>
        </h3>
        <p class="card__product-code">Product code: 195434</p>
        <div class="card__rating">
          <div class="card__stars card__stars--4">
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
          </div>
          <div class="card__reviews">Reviews: 5</div>
        </div>
        <div class="card__price">
          <span class="card__price-label">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>
        <a href="#" class="card__button">
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
